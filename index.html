<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1c2c" />
    <title>Super Plumber Bros — Pixi v8 ECS Platformer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1c2c; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      #hud-root { position: fixed; inset: 0; pointer-events: none; font-family: "Courier New", monospace; }
      #hud-root * { user-select: none; -webkit-user-select: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
